name: Import Venue Map

on:
  workflow_dispatch:

jobs:
  import-venue-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Import venue map from CFBD
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m etl.jobs.one_off_updates.import_venue_map
