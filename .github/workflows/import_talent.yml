name: Import Talent Ratings

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Optional season override (for example 2026). Leave blank to use the default inferred season."
        required: false
        type: string
        default: ""

jobs:
  import-talent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
      - name: Import talent ratings from CFBD
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.one_off_updates.import_talent
