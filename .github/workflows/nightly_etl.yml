name: Nightly ETL

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  update-current-season:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Run nightly season refresh
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m etl.jobs.update_current_season

      - name: Update team advanced season stats
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m etl.jobs.update_team_advanced_stats

      - name: Update team advanced game stats
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m etl.jobs.update_team_advanced_game_stats

      - name: Update rankings
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m etl.jobs.update_rankings

      - name: Update betting odds table
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python -m etl.jobs.update_betting_odds

#      - name: Add ratings for today only
#        working-directory: etl
#        env:
#          PG_DSN: ${{ secrets.PG_DSN }}
#          # START_SEASON: 2025
#          # END_SEASON: 2025
#          ASOF_MIN: ${{ steps.today.outputs.date }}
#          ASOF_MAX: ${{ steps.today.outputs.date }}
#        run: python update_team_ratings.py

      - name: Update game predictions
        working-directory: etl
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          MODEL_VERSION: "predictions_v1"
          RATING_LAG_DAYS: "1"
        run: |
          python "update_game_predictions.py"
