name: Nightly ETL

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Optional season override (for example 2025). Leave blank to use the default inferred season."
        required: false
        type: string
        default: ""
      prediction_run_type:
        description: "Prediction snapshot run type for manual workflow runs."
        required: false
        type: choice
        default: "manual"
        options:
          - manual
          - backfill

jobs:
  update-current-season:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Run nightly season refresh
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.nightly_data_updates.update_current_season

      - name: Update team advanced season stats
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.nightly_data_updates.update_team_advanced_stats

      - name: Update team advanced game stats
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.nightly_data_updates.update_team_advanced_game_stats

      - name: Update rankings
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.nightly_data_updates.update_rankings

      - name: Update betting odds table
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.nightly_data_updates.update_betting_odds

      - name: Update transfer portal table
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASON: ${{ github.event.inputs.season }}
        run: python -m etl.jobs.nightly_data_updates.update_transfer_portal

      - name: Update full game prediction snapshots
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          SEASON: ${{ github.event.inputs.season }}
          GAME_PREDICTION_RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prediction_run_type || 'nightly' }}
        run: python -m etl.jobs.prediction_updates.update_game_predictions_full

      - name: Update team rating snapshots
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          SEASON: ${{ github.event.inputs.season }}
          TEAM_RATING_RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prediction_run_type || 'nightly' }}
        run: python -m etl.jobs.prediction_updates.update_team_ratings_full

      - name: Update ranking projection snapshots
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          SEASON: ${{ github.event.inputs.season }}
          RANKING_PROJECTION_RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prediction_run_type || 'nightly' }}
        run: python -m etl.jobs.prediction_updates.update_ranking_projections

      - name: Update season prediction snapshots
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          SEASON: ${{ github.event.inputs.season }}
          SEASON_PREDICTION_RUN_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prediction_run_type || 'nightly' }}
        run: python -m etl.jobs.prediction_updates.update_season_predictions_full
